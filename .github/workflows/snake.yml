# Builds the contribution-graph snake animation with Platane/snk
# (https://github.com/Platane/snk) and publishes it to the `output` branch,
# which README.md loads via raw.githubusercontent.com.
name: snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (Lakers gold on night sky)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#fdb927&color_dots=#161b22,#3b2a6b,#552583,#b8860b,#fdb927
            dist/snake-light.svg?color_snake=#552583&color_dots=#ebedf0,#f6e2a8,#f2c94c,#d4a017,#8a6100

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
